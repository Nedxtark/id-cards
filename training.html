<!DOCTYPE html>
<html>
<head>
<title>Training Records</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial;
  background: #f3f4f6;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
}

/* FORM */
input,
select,
textarea,
.dropdown-box {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ddd;
  font-family: Arial;
  font-size: 13px;
  display: block;
  box-sizing: border-box;
}

input::placeholder,
textarea::placeholder { color: #9ca3af; }

input, textarea { color: #111827; }

select { color: #9ca3af; }

select:focus { color: #111827; }

textarea {
  min-height: 60px;
  resize: vertical;
}

/* BUTTONS */
button {
  padding: 8px 12px;
  border: none;
  background: #6b7280;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  margin-right: 5px;
}

/* TABLE */
.table {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
}

.table th,
.table td {
  border-bottom: 1px solid #eee;
  padding: 6px 8px;
  font-size: 11.5px;
  text-align: left;
  white-space: nowrap;
}

/* DROPDOWN */
.dropdown-box {
  background: white;
  cursor: pointer;
  color: rgba(156, 163, 175, 0.85);
}

.dropdown-menu-scroll {
  position: absolute;
  width: 100%;
  background: white;
  border: 1px solid #ddd;
  border-radius: 6px;
  max-height: 180px;
  overflow-y: auto;
  display: none;
  z-index: 1000;
}

.dropdown-menu-scroll div {
  padding: 8px;
  cursor: pointer;
}

.dropdown-menu-scroll div:hover {
  background: #f3f4f6;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h3>Add Training</h3>

    <select id="training_name">
      <option value="" disabled selected hidden>Training Name</option>
      <option>Hydraulic Excavator NC II</option>
      <option>Road Roller (Compactor) NC II</option>
      <option>Forklift NC II</option>
      <option>Driving (Articulated Vehicle) NC III</option>
      <option>Driving (Passenger Bus/Straight Truck) NC III</option>
    </select>

    <div class="scroll-dropdown">
      <div class="dropdown-box" onclick="toggleTrainerList()">
        <span id="trainer_display">Trainer</span>
      </div>

      <div id="trainer_list" class="dropdown-menu-scroll">
        <div onclick="selectTrainer('Sherlene Y. Jabeniao')">Sherlene</div>
        <div onclick="selectTrainer('Gaugie Martin Y. Efondo')">Gaugie</div>
      </div>

      <input type="hidden" id="trainer">
    </div>

    <input type="text" id="date_started" placeholder="Date Started"
      onfocus="this.type='date'"
      onblur="if(!this.value)this.type='text'">

    <input type="text" id="date_completed" placeholder="Date Completed"
      onfocus="this.type='date'"
      onblur="if(!this.value)this.type='text'">

    <select id="status">
      <option value="" disabled selected hidden>Status</option>
      <option value="Completed">Completed</option>
      <option value="Ongoing">Ongoing</option>
    </select>

    <textarea id="remarks" placeholder="Remarks"></textarea>

    <button onclick="saveTraining()">Save Training</button>
    <button onclick="resetForm()">Cancel</button>
  </div>

  <div class="card">
    <h3>Training List</h3>
    <table class="table">
      <thead>
        <tr>
          <th>Training</th>
          <th>Trainer</th>
          <th>Start</th>
          <th>End</th>
          <th>Status</th>
          <th>Remarks</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="trainingTable"></tbody>
    </table>
  </div>

</div>

<!-- SUPABASE LIB -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const training_name = document.getElementById("training_name");
const trainer = document.getElementById("trainer");
const date_started = document.getElementById("date_started");
const date_completed = document.getElementById("date_completed");
const status = document.getElementById("status");
const remarks = document.getElementById("remarks");

let selectedTrainingID = null;

const urlParams = new URLSearchParams(window.location.search);
const personID = urlParams.get("id");

if (!personID) {
  alert("No person selected");
  throw new Error("Missing person ID");
}

/* AUTH + INIT */
window.addEventListener("load", async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "login.html";
    return;
  }

  loadTraining();
});

/* LOAD */
function loadTraining() {
  fetch(`${SUPABASE_URL}/rest/v1/training?person_id=eq.${personID}&order=date_started.desc`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  })
  .then(r => r.json())
  .then(data => {

    const table = document.getElementById("trainingTable");
    table.innerHTML = "";

    data.forEach(t => {
      table.innerHTML += `
        <tr>
          <td>${t.training_name || ""}</td>
          <td>${t.trainer || ""}</td>
          <td>${t.date_started || ""}</td>
          <td>${t.date_completed || ""}</td>
          <td>${t.status || ""}</td>
          <td>${t.remarks || ""}</td>
          <td>
            <button onclick="editTraining(${t.id}, this)">Edit</button>
            <button onclick="deleteTraining(${t.id})">Delete</button>
          </td>
        </tr>
      `;
    });

  });
}

/* SAVE */
function saveTraining() {

  const payload = {
    person_id: personID,
    training_name: training_name.value,
    trainer: trainer.value,
    date_started: date_started.value || null,
    date_completed: date_completed.value || null,
    status: status.value,
    remarks: remarks.value
  };

  fetch(`${SUPABASE_URL}/rest/v1/training`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  }).then(() => {
    alert("Saved!");
    resetForm();
    loadTraining();
  });
}

/* RESET */
function resetForm() {
  training_name.value = "";
  trainer.value = "";
  date_started.value = "";
  date_completed.value = "";
  status.selectedIndex = 0;
  remarks.value = "";
}

/* DELETE */
function deleteTraining(id) {
  fetch(`${SUPABASE_URL}/rest/v1/training?id=eq.${id}`, {
    method: "DELETE",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  }).then(() => loadTraining());
}

/* DROPDOWN */
function toggleTrainerList() {
  const el = document.getElementById("trainer_list");
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function selectTrainer(value) {
  trainer.value = value;
  document.getElementById("trainer_display").innerText = value;
  document.getElementById("trainer_list").style.display = "none";
}

</script>

</body>
</html>
