<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body {
  font-family: Arial;
  background: #f3f4f6;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.container {
  display: flex;
  gap: 60px;
}
.card {
  width: 220px;
  padding: 20px;
  background: white;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}
.card:hover {
  transform: scale(1.05);
}
  .logo {
  width: 100%;
  height: 120px;
  object-fit: contain;
}
</style>
</head>

<body>

<div class="container">

  <div class="container">

  <div class="card" onclick="go('trucking')">
    <img src="wtfs.png" class="logo">
  </div>

 <div class="card" onclick="go('training')">
    <img src="logo.png" class="logo">
  </div>

</div>

<script>
function go(type) {
  window.location.href = "form.html?division=" + type;
}
</script>

</body>
</html>
