<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card</title>
<style>
  body { font-family: Arial, sans-serif; display:flex; justify-content:center; margin-top:50px; }
  .id-card { width: 350px; height: 200px; border: 2px solid #333; padding: 20px; border-radius:10px; box-shadow: 2px 2px 10px rgba(0,0,0,0.3); position:relative; }
  .id-card img.photo { width: 80px; height: 100px; object-fit:cover; position:absolute; top:20px; right:20px; border:1px solid #333; }
  .id-card h2 { margin: 0; font-size:18px; }
  .id-card p { margin: 2px 0; font-size:14px; }
</style>
</head>
<body>
<div class="id-card">
  <h2 id="fullName">Loading...</h2>
  <p>ID: <span id="personID"></span></p>
  <p>Birthdate: <span id="birthdate"></span></p>
  <p>Gender: <span id="gender"></span></p>
  <p>Age: <span id="age"></span></p>
  <p>Address: <span id="address"></span></p>
  <p>Mobile: <span id="mobile"></span></p>
  <p>Email: <span id="email"></span></p>
  <img id="photo" class="photo" src="" alt="Photo">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI";

const supabase = supabase.createClient(https://euocewpmtmevbxoskmlr.supabase.co, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI);

// Get id from URL
const urlParams = new URLSearchParams(window.location.search);
const personID = urlParams.get('id');

document.getElementById('personID').textContent = personID;

async function loadData() {
    if(!personID) return;

    let { data, error } = await supabase
        .from('ids')
        .select('*')
        .eq('person_id', personID)
        .single();

    if(error) {
        alert("Record not found or error: " + error.message);
        return;
    }

    document.getElementById('fullName').textContent = data.Name;
    document.getElementById('birthdate').textContent = data.Birthdate;
    document.getElementById('gender').textContent = data.Gender;
    document.getElementById('age').textContent = data.Age;
    document.getElementById('address').textContent = data.Address;
    document.getElementById('mobile').textContent = data.Mobile;
    document.getElementById('email').textContent = data.Email;
    if(data.Photo) {
        document.getElementById('photo').src = data.Photo;
    }
}

loadData();
</script>
</body>
</html>
