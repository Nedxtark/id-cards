<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    margin-top: 30px;
    background: #f0f0f0;
  }

  .id-card {
    width: 3.375in;  /* CR80 width */
    height: 2.125in; /* CR80 height */
    background: linear-gradient(135deg, #4a90e2, #357ABD);
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    color: white;
    padding: 15px;
    position: relative;
    overflow: hidden;
  }

  .logo {
    position: absolute;
    top: 15px;
    left: 15px;
    width: 60px;
    height: 60px;
    object-fit: contain;
  }

  .photo {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 60px;
    height: 60px;
    border: 2px solid white;
    border-radius: 5px;
    object-fit: cover;
  }

  .qr {
    position: absolute;
    bottom: 15px;
    right: 15px;
    width: 60px;
    height: 60px;
  }

  .info {
    position: absolute;
    top: 90px;
    left: 15px;
    right: 90px;
    font-size: 12px;
    line-height: 1.3;
  }

  .info h2 {
    margin: 0;
    font-size: 14px;
  }

  .info p {
    margin: 2px 0;
    font-size: 11px;
  }

  .id-number {
    position: absolute;
    bottom: 15px;
    left: 15px;
    font-weight: bold;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="id-card">
  <img src="logo.png" alt="Logo" class="logo" id="logo">
  <img src="" alt="Photo" class="photo" id="photo">
  <img src="" alt="QR Code" class="qr" id="qr">

  <div class="info">
    <h2 id="name">Full Name</h2>
    <p><strong>Birthdate:</strong> <span id="birthdate"></span></p>
    <p><strong>Gender:</strong> <span id="gender"></span></p>
    <p><strong>Age:</strong> <span id="age"></span></p>
    <p><strong>Address:</strong> <span id="address"></span></p>
    <p><strong>Mobile:</strong> <span id="mobile"></span></p>
    <p><strong>Email:</strong> <span id="email"></span></p>
  </div>

  <div class="id-number">
    ID: <span id="person_id"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase setup
  const SUPABASE_URL = 'https://euocewpmtmevbxoskmlr.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Get person_id from URL
  const urlParams = new URLSearchParams(window.location.search);
  const personID = urlParams.get('id');

  async function loadData() {
    if (!personID) return alert('No ID specified');

    const { data, error } = await supabase
      .from('ids')
      .select('*')
      .eq('person_id', personID)
      .single();

    if (error) {
      return alert('Record not found: ' + error.message);
    }

    // Fill data
    document.getElementById('name').textContent = data.Name;
    document.getElementById('birthdate').textContent = data.Birthdate;
    document.getElementById('gender').textContent = data.Gender;
    document.getElementById('age').textContent = data.Age;
    document.getElementById('address').textContent = data.Address;
    document.getElementById('mobile').textContent = data.Mobile;
    document.getElementById('email').textContent = data.Email;
    document.getElementById('person_id').textContent = data.person_id;

    // Load images
    if (data.Photo) document.getElementById('photo').src = data.Photo;

    // Generate QR code dynamically
    const qrURL = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(window.location.href)}`;
    document.getElementById('qr').src = qrURL;
  }

  loadData();
</script>
</body>
</html>
