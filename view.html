<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Printable ID Card</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    padding: 20px;
    font-family: 'Arial', sans-serif;
  }

  .id-card {
    width: 856px;  /* 85.6mm in px at 10px/mm (adjust for print) */
    height: 540px; /* 53.98mm in px at 10px/mm */
    background: white;
    border: 2px solid #333;
    border-radius: 15px;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    page-break-inside: avoid;
  }

  .logo {
    width: 100px;
    height: auto;
    display: block;
    margin: 0 auto 10px;
  }

  .id-header {
    text-align: center;
    margin-bottom: 10px;
  }

  .id-header h2 {
    margin: 0;
    font-size: 24px;
  }
  .id-header h4 {
    margin: 0;
    font-size: 16px;
    font-weight: normal;
  }

  .id-body {
    display: flex;
  }

  .photo {
    width: 120px;
    height: 150px;
    border: 2px solid #333;
    border-radius: 5px;
    object-fit: cover;
    margin-right: 20px;
  }

  .info {
    flex: 1;
    font-size: 16px;
  }

  .info div {
    margin-bottom: 5px;
  }

  .label {
    font-weight: bold;
    color: #555;
  }

  .qr {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 100px;
    height: 100px;
  }

  @media print {
    body {
      background: none;
    }
    .id-card {
      box-shadow: none;
      border: 1px solid #000;
    }
  }
</style>
</head>
<body>

<div class="id-card">
  <img src="logo.png" class="logo" alt="Logo">

  <div class="id-header">
    <h2>Company / Organization</h2>
    <h4>ID Card</h4>
  </div>

  <div class="id-body">
    <img id="photo" class="photo" src="" alt="Photo">
    <div class="info">
      <div><span class="label">Name:</span> <span id="name"></span></div>
      <div><span class="label">Birthdate:</span> <span id="birthdate"></span></div>
      <div><span class="label">Gender:</span> <span id="gender"></span></div>
      <div><span class="label">Age:</span> <span id="age"></span></div>
      <div><span class="label">Address:</span> <span id="address"></span></div>
      <div><span class="label">Mobile:</span> <span id="mobile"></span></div>
      <div><span class="label">Email:</span> <span id="email"></span></div>
      <div><span class="label">ID:</span> <span id="person_id"></span></div>
    </div>
  </div>

  <img id="qr" class="qr" src="" alt="QR Code">
</div>

<script>
  const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co";
  const SUPABASE_KEY = "YOUR_ANON_KEY_HERE"; // replace with your anon key
  const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(window.location.search);
  const personID = params.get('id');

  async function loadData(id) {
    const { data, error } = await supabase
      .from('ids')
      .select('*')
      .eq('person_id', id)
      .single();

    if (error || !data) {
      alert("Record not found!");
      return;
    }

    document.getElementById("photo").src = data.Photo || "placeholder.png";
    document.getElementById("name").textContent = data.Name || "";
    document.getElementById("birthdate").textContent = data.Birthdate || "";
    document.getElementById("gender").textContent = data.Gender || "";
    document.getElementById("age").textContent = data.Age || "";
    document.getElementById("address").textContent = data.Address || "";
    document.getElementById("mobile").textContent = data.Mobile || "";
    document.getElementById("email").textContent = data.Email || "";
    document.getElementById("person_id").textContent = data.person_id || "";

    const qrData = `${window.location.origin + window.location.pathname}?id=${id}`;
    document.getElementById("qr").src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrData)}`;
  }

  if (personID) loadData(personID);
</script>

</body>
</html>
