<!DOCTYPE html>
<html>
<head>
  <title>Supabase Save</title>

  <!-- ✅ Put Supabase CDN here -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

  <h2>Student Form</h2>

  <!-- Your input fields -->
  <input type="text" id="name" placeholder="Name"><br><br>
  <input type="text" id="course" placeholder="Course"><br><br>
  <input type="text" id="year" placeholder="Year"><br><br>

  <!-- Button to trigger save -->
  <button onclick="saveData()">Save</button>

  <!-- ✅ Put your script HERE (after inputs) -->
  <script>
    const supabaseClient = supabase.createClient(
      "YOUR_URL",
      "YOUR_ANON_KEY"
    );

    async function saveData() {
      const name = document.getElementById("name").value;
      const course = document.getElementById("course").value;
      const year = document.getElementById("year").value;

      const { data, error } = await supabaseClient
        .from("ids")
        .insert([{ name, course, year }])
        .select();

      if (error) {
        alert("Error saving");
        console.log(error);
      } else {
        const id = data[0].id;
        alert("Saved! ID: " + id);
      }
    }
  </script>

</body>
</html>
