<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

  body {
    font-family: 'Montserrat', sans-serif;
    background: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .id-card {
    width: 340px;  /* CR80 card */
    height: 210px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    background: #ffb74d;
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 10px;
  }

  .top-bar img {
    height: 30px;
  }

  .main {
    flex: 1;
    display: flex;
    padding: 10px;
  }

  .photo-section {
    width: 90px;
    height: 120px;
    flex-shrink: 0;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .photo-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .info-section {
    flex: 1;
    margin-left: 15px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .info-section h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  .info-section p {
    margin: 2px 0;
    font-size: 12px;
  }

  .qr-section {
    display: flex;
    justify-content: flex-end;
    padding: 0 10px 10px 0;
  }

  .qr-section img {
    width: 70px;
    height: 70px;
    border: 2px solid #fff;
    border-radius: 6px;
    background: #fff;
  }
</style>
</head>
<body>

<div class="id-card">
  <div class="top-bar">
    <img src="logo.png" alt="Logo">
  </div>
  <div class="main">
    <div class="photo-section">
      <img id="photo" src="" alt="Photo">
    </div>
    <div class="info-section">
      <div>
        <h2 id="name">Full Name</h2>
        <p><strong>ID:</strong> <span id="person_id"></span></p>
        <p><strong>Birthdate:</strong> <span id="birthdate"></span></p>
        <p><strong>Gender:</strong> <span id="gender"></span></p>
        <p><strong>Age:</strong> <span id="age"></span></p>
        <p><strong>Address:</strong> <span id="address"></span></p>
        <p><strong>Mobile:</strong> <span id="mobile"></span></p>
        <p><strong>Email:</strong> <span id="email"></span></p>
      </div>
    </div>
  </div>
  <div class="qr-section">
    <img id="qr" src="" alt="QR Code">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const url = 'https://euocewpmtmevbxoskmlr.supabase.co';
const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI';
const supabase = supabase.createClient(url, key);

const params = new URLSearchParams(window.location.search);
const personID = params.get('id');

async function loadID() {
  const { data, error } = await supabase
    .from('ids')
    .select('*')
    .eq('person_id', personID)
    .single();
    
  if (error || !data) {
    alert('PersonID not found!');
    return;
  }

  document.getElementById('name').textContent = data.Name;
  document.getElementById('person_id').textContent = data.person_id;
  document.getElementById('birthdate').textContent = data.Birthdate;
  document.getElementById('gender').textContent = data.Gender;
  document.getElementById('age').textContent = data.Age;
  document.getElementById('address').textContent = data.Address;
  document.getElementById('mobile').textContent = data.Mobile;
  document.getElementById('email').textContent = data.Email;
  document.getElementById('photo').src = data.Photo;
  document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=70x70&data=${personID}`;
}

loadID();
</script>

</body>
</html>
