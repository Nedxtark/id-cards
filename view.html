<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .id-card {
    width: 340px; /* CR80 card width */
    height: 210px; /* CR80 card height */
    background: linear-gradient(135deg, #4a90e2, #357ABD);
    border-radius: 10px;
    color: white;
    display: flex;
    flex-direction: row;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    padding: 10px;
  }
  .left {
    width: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
  }
  .left img {
    width: 80px;
    height: 100px;
    object-fit: cover;
    border-radius: 5px;
    border: 2px solid white;
  }
  .right {
    flex: 1;
    padding-left: 15px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .right .info {
    flex: 1;
  }
  .right h2, .right p {
    margin: 3px 0;
  }
  .qr {
    width: 80px;
    height: 80px;
    align-self: flex-end;
  }
</style>
</head>
<body>

<div class="id-card">
  <div class="left">
    <img id="photo" src="" alt="Photo">
  </div>
  <div class="right">
    <div class="info">
      <h2 id="name">Full Name</h2>
      <p><strong>ID:</strong> <span id="person_id"></span></p>
      <p><strong>Birthdate:</strong> <span id="birthdate"></span></p>
      <p><strong>Gender:</strong> <span id="gender"></span></p>
      <p><strong>Age:</strong> <span id="age"></span></p>
      <p><strong>Address:</strong> <span id="address"></span></p>
      <p><strong>Mobile:</strong> <span id="mobile"></span></p>
      <p><strong>Email:</strong> <span id="email"></span></p>
    </div>
    <img id="qr" class="qr" src="" alt="QR Code">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const url = 'https://euocewpmtmevbxoskmlr.supabase.co';
const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI';
const supabase = supabase.createClient(url, key);

const params = new URLSearchParams(window.location.search);
const personID = params.get('id');

async function loadID() {
  const { data, error } = await supabase
    .from('ids')
    .select('*')
    .eq('person_id', personID)
    .single();
    
  if (error || !data) {
    alert('PersonID not found!');
    return;
  }

  document.getElementById('name').textContent = data.Name;
  document.getElementById('person_id').textContent = data.person_id;
  document.getElementById('birthdate').textContent = data.Birthdate;
  document.getElementById('gender').textContent = data.Gender;
  document.getElementById('age').textContent = data.Age;
  document.getElementById('address').textContent = data.Address;
  document.getElementById('mobile').textContent = data.Mobile;
  document.getElementById('email').textContent = data.Email;
  document.getElementById('photo').src = data.Photo;
  document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${personID}`;
}

loadID();
</script>

</body>
</html>
