<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

body {
  font-family: 'Montserrat', sans-serif;
  background: #e5e5e5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CARD */
.id-card {
  width: 340px;
  height: 210px;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: #fff;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.top-bar {
  background: #ffb74d;
  height: 42px;
  display: flex;
  align-items: center;
  padding: 0 12px;
}

.top-bar img {
  height: 28px;
}

/* MAIN CONTENT */
.main {
  display: flex;
  padding: 12px;
  gap: 12px;
}

/* PHOTO */
.photo-section {
  width: 95px;
  height: 125px;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
}

.photo-section img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* INFO */
.info-section {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* NAME */
.name {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: 0.3px;
}

/* ID */
.id-line {
  font-size: 11px;
  margin-bottom: 8px;
  opacity: 0.9;
}

/* DETAILS GRID */
.details {
  display: grid;
  grid-template-columns: 1fr;
  row-gap: 4px;
  font-size: 11px;
  line-height: 1.4;
}

/* LABEL STYLE */
.label {
  opacity: 0.75;
  font-weight: 500;
}

.value {
  font-weight: 600;
}

/* FOOTER */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 12px 10px 12px;
}

/* QR */
.qr img {
  width: 70px;
  height: 70px;
  background: #fff;
  padding: 4px;
  border-radius: 6px;
}

/* SMALL TEXT */
.footer-text {
  font-size: 10px;
  opacity: 0.8;
}

</style>
</head>

<body>

<div class="id-card">

  <!-- HEADER -->
  <div class="top-bar">
    <img src="logo.png" alt="Logo">
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- PHOTO -->
    <div class="photo-section">
      <img id="photo" src="">
    </div>

    <!-- INFO -->
    <div class="info-section">

      <div class="name" id="name">Full Name</div>

      <div class="id-line">
        ID: <span id="person_id"></span>
      </div>

      <div class="details">
        <div><span class="label">Birthdate:</span> <span class="value" id="birthdate"></span></div>
        <div><span class="label">Gender:</span> <span class="value" id="gender"></span></div>
        <div><span class="label">Age:</span> <span class="value" id="age"></span></div>
        <div><span class="label">Address:</span> <span class="value" id="address"></span></div>
        <div><span class="label">Mobile:</span> <span class="value" id="mobile"></span></div>
        <div><span class="label">Email:</span> <span class="value" id="email"></span></div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-text">Valid ID Card</div>
    <div class="qr">
      <img id="qr" src="">
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const url = 'https://euocewpmtmevbxoskmlr.supabase.co';
const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI';
const supabase = supabase.createClient(url, key);

const params = new URLSearchParams(window.location.search);
const personID = params.get('id');

async function loadID() {
  const { data, error } = await supabase
    .from('ids')
    .select('*')
    .eq('person_id', personID)
    .single();

  if (error || !data) {
    alert('ID not found');
    return;
  }

  document.getElementById('name').textContent = data.Name;
  document.getElementById('person_id').textContent = data.person_id;
  document.getElementById('birthdate').textContent = data.Birthdate;
  document.getElementById('gender').textContent = data.Gender;
  document.getElementById('age').textContent = data.Age;
  document.getElementById('address').textContent = data.Address;
  document.getElementById('mobile').textContent = data.Mobile;
  document.getElementById('email').textContent = data.Email;
  document.getElementById('photo').src = data.Photo;

  document.getElementById('qr').src =
    `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${window.location.href}`;
}

loadID();
</script>

</body>
</html>
