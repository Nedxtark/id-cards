<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital ID Card</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e3e9f7, #f5f7fb);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CARD */
.card {
  width: 360px;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  overflow: hidden;
}

/* HEADER */
.header {
  background: #2c3e50;
  color: #fff;
  padding: 15px;
  text-align: center;
  font-weight: bold;
  letter-spacing: 1px;
}

/* PHOTO */
.photo-container {
  display: flex;
  justify-content: center;
  margin-top: 15px;
}

.photo {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* NAME */
.name {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-top: 10px;
  letter-spacing: 0.5px;
}

/* INFO */
.info {
  padding: 15px 20px;
}

.row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 14px;
}

.label {
  color: #555;
  font-weight: 600;
}

.value {
  color: #111;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 12px;
  border-top: 1px solid #eee;
}

.qr {
  width: 90px;
  height: 90px;
}

.status {
  margin-top: 8px;
  font-size: 12px;
  color: green;
  font-weight: bold;
}
</style>

</head>
<body>

<div class="card" id="card">

  <div class="header">IDENTIFICATION CARD</div>

  <div class="photo-container">
    <img id="photo" class="photo" src="">
  </div>

  <div class="name" id="name">Loading...</div>

  <div class="info">
    <div class="row"><span class="label">ID:</span><span id="person_id" class="value"></span></div>
    <div class="row"><span class="label">Birthdate:</span><span id="birthdate" class="value"></span></div>
    <div class="row"><span class="label">Gender:</span><span id="gender" class="value"></span></div>
    <div class="row"><span class="label">Age:</span><span id="age" class="value"></span></div>
    <div class="row"><span class="label">Address:</span><span id="address" class="value"></span></div>
    <div class="row"><span class="label">Mobile:</span><span id="mobile" class="value"></span></div>
    <div class="row"><span class="label">Email:</span><span id="email" class="value"></span></div>
  </div>

  <div class="footer">
    <img id="qr" class="qr" src="">
    <div class="status">✔ VERIFIED</div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co"
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI" // ⚠️ PUT CORRECT KEY

const params = new URLSearchParams(window.location.search)
const personID = params.get("id")

if (!personID) {
  document.getElementById("card").innerHTML = "<h3>No ID provided</h3>"
} else {

  fetch(`${SUPABASE_URL}/rest/v1/ids?person_id=eq.${personID}&select=*`, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }
  })
  .then(res => {
    if (!res.ok) throw new Error("HTTP " + res.status)
    return res.json()
  })
  .then(data => {

    if (data.length === 0) {
      document.getElementById("card").innerHTML = "<h3>ID not found</h3>"
      return
    }

    const p = data[0]

    document.getElementById("photo").src = p.Photo || "https://via.placeholder.com/120"
    document.getElementById("name").innerText = p.Name
    document.getElementById("person_id").innerText = p.person_id
    document.getElementById("birthdate").innerText = p.Birthdate
    document.getElementById("gender").innerText = p.Gender
    document.getElementById("age").innerText = p.Age
    document.getElementById("address").innerText = p.Address
    document.getElementById("mobile").innerText = p.Mobile
    document.getElementById("email").innerText = p.Email

    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=" + p.person_id

  })
  .catch(err => {
    console.error(err)
    document.getElementById("card").innerHTML =
      "<h3 style='color:red;'>Error fetching data</h3>"
  })
}
</script>

</body>
</html>
