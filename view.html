<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital ID Card</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e3e9f7, #f5f7fb);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  width: 360px;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  overflow: hidden;
  position: relative;
}

/* 🔥 FIX: allow clicks through overlay */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url('logo.png') no-repeat center;
  background-size: 350px;
  opacity: 0.15;
  pointer-events: none;
}

.header {
  background: #2c3e50;
  color: #fff;
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

.photo-container {
  display: flex;
  justify-content: center;
  margin-top: 15px;
}

.photo {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #fff;
}

.name {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-top: 10px;
}

.info {
  padding: 15px 20px;
}

.row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 14px;
}

.label { font-weight: 600; color: #555; }
.value { color: #111; }

.footer {
  text-align: center;
  padding: 12px;
  border-top: 1px solid #eee;
}

.training-btn {
  background: #3498db;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
}

.training-btn:hover {
  background: #2980b9;
}

.training-container {
  display: none;
  margin-top: 10px;
  text-align: left;
}

.training-card {
  border: 1px solid #ddd;
  padding: 8px;
  margin-top: 6px;
  font-size: 12px;
}

.status {
  margin-top: 8px;
  font-size: 12px;
  color: green;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card" id="card">
  <div class="header">IDENTIFICATION CARD</div>

  <div class="photo-container">
    <img id="photo" class="photo" src="https://via.placeholder.com/120">
  </div>

  <div class="name" id="name">Loading...</div>

  <div class="info">
    <div class="row"><span class="label">ID:</span><span id="person_id"></span></div>
    <div class="row"><span class="label">Birthdate:</span><span id="birthdate"></span></div>
    <div class="row"><span class="label">Gender:</span><span id="gender"></span></div>
    <div class="row"><span class="label">Age:</span><span id="age"></span></div>
    <div class="row"><span class="label">Address:</span><span id="address"></span></div>
    <div class="row"><span class="label">Mobile:</span><span id="mobile"></span></div>
    <div class="row"><span class="label">Email:</span><span id="email"></span></div>
  </div>

  <div class="footer">
    <button id="trainingBtn" class="training-btn">View Training</button>
    <div id="trainingContainer" class="training-container"></div>
    <div class="status">✔ VERIFIED</div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co"
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI"

const params = new URLSearchParams(window.location.search);

let personID = params.get("id");
let division = params.get("division") || "trucking";

personID = decodeURIComponent(personID || "").trim();
  let table = "ids_trucking";

if (division === "training") {
  table = "ids_training";
}

let loaded = false

const trainingBtn = document.getElementById("trainingBtn")
const container = document.getElementById("trainingContainer")

// ✅ BUTTON WORKING
trainingBtn.onclick = () => {

  const isHidden = window.getComputedStyle(container).display === "none"

  if (!isHidden) {
    container.style.display = "none"
    loaded = false
    return
  }

  container.style.display = "block"

  if (!personID) {
    container.innerHTML = "<span style='color:red;'>No ID provided</span>"
    return
  }

  if (loaded) return
  loaded = true

  container.innerHTML = "Loading trainings..."

  fetch(`${SUPABASE_URL}/rest/v1/training?person_id=eq.${encodeURIComponent(personID)}`, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }
  })
  .then(res => {
    console.log("STATUS:", res.status)
    return res.json()
  })
  .then(data => {

    console.log("TRAINING DATA:", data)

    if (!data || data.length === 0) {
      container.innerHTML = "<i>No trainings found</i>"
      return
    }

    let html = ""

    data.forEach(t => {
      html += `
        <div class="training-card">
          <b>${t.training_name || 'N/A'}</b><br>
          Trainer: ${t.trainer || 'N/A'}<br>
          Start: ${t.date_started || 'N/A'}<br>
          Completed: ${t.date_completed || 'N/A'}<br>
          Status: ${t.status || 'N/A'}
        </div>
      `
    })

    container.innerHTML = html
  })
  .catch(err => {
    console.error(err)
    container.innerHTML = "<span style='color:red;'>Error loading trainings</span>"
  })
}


// LOAD ID DATA
if (!personID) {
  document.getElementById("card").innerHTML = "<h3>No ID provided</h3>"
} else {

fetch(`${SUPABASE_URL}/rest/v1/${table}?person_id=eq.${encodeURIComponent(personID)}`, {
  headers: {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY
  }
})
.then(res => res.json())
.then(data => {

  if (!data || data.length === 0) {
    document.getElementById("card").innerHTML =
      `<h3>ID not found</h3><small>${personID}</small>`
    return
  }

  const p = data[0]

  const photoUrl = p.photo
    ? `${SUPABASE_URL}/storage/v1/object/public/photos/${p.photo}`
    : "https://via.placeholder.com/120"

  document.getElementById("photo").src = photoUrl
  document.getElementById("name").innerText = p.name || "N/A"
  document.getElementById("person_id").innerText = p.person_id || ""
  document.getElementById("birthdate").innerText = p.birthdate || ""
  document.getElementById("gender").innerText = p.gender || ""
  document.getElementById("age").innerText = p.age || ""
  document.getElementById("address").innerText = p.address || ""
  document.getElementById("mobile").innerText = p.mobile || ""
  document.getElementById("email").innerText = p.email || ""

})
.catch(() => {
  document.getElementById("card").innerHTML =
    "<h3 style='color:red;'>Error loading ID</h3>"
})

}

})
</script>

</body>
</html>
