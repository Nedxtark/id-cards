<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card Viewer</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .card { width: 400px; padding: 20px; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 8px; text-align: center; }
  .photo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
  .qr { width: 100px; height: 100px; margin-top: 15px; }
  .info { text-align: left; margin-top: 10px; }
  .info div { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="card" id="card">
  <img src="" class="photo" id="photo">
  <h2 id="name"></h2>
  <div class="info">
    <div><strong>Person ID:</strong> <span id="person_id"></span></div>
    <div><strong>Birthdate:</strong> <span id="birthdate"></span></div>
    <div><strong>Gender:</strong> <span id="gender"></span></div>
    <div><strong>Age:</strong> <span id="age"></span></div>
    <div><strong>Address:</strong> <span id="address"></span></div>
    <div><strong>Mobile:</strong> <span id="mobile"></span></div>
    <div><strong>Email:</strong> <span id="email"></span></div>
  </div>
  <img src="" class="qr" id="qr">
</div>

<script>
  // Supabase project info
  const SUPABASE_URL = 'https://euocewpmtmevbxoskmlr.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI'; // replace with your anon key

  // Get person_id from URL
  const params = new URLSearchParams(window.location.search);
  const personID = params.get('id');

  if(!personID) {
    document.getElementById('card').innerHTML = '<p>Person ID not provided.</p>';
  } else {
    fetch(`${SUPABASE_URL}/rest/v1/ids?person_id=eq.${personID}`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json'
      }
    })
    .then(res => res.json())
    .then(data => {
      if(data.length === 0) {
        document.getElementById('card').innerHTML = '<p>Person not found.</p>';
      } else {
        const person = data[0];
        document.getElementById('photo').src = person.Photo || '';
        document.getElementById('name').innerText = person.Name;
        document.getElementById('person_id').innerText = person.person_id;
        document.getElementById('birthdate').innerText = person.Birthdate;
        document.getElementById('gender').innerText = person.Gender;
        document.getElementById('age').innerText = person.Age;
        document.getElementById('address').innerText = person.Address;
        document.getElementById('mobile').innerText = person.Mobile;
        document.getElementById('email').innerText = person.Email;
        document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${person.person_id}`;
      }
    })
    .catch(err => {
      console.error(err);
      document.getElementById('card').innerHTML = '<p>Error fetching data.</p>';
    });
  }
</script>
</body>
</html>
