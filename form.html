<!DOCTYPE html>
<html>
<head>
<title>Uniform ID Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial;
  background: #f3f4f6;
}

.topbar {
  display: flex;
  justify-content: center;
  padding: 12px;
  background: #fff;
  border-bottom: 1px solid #ddd;
}

.search-box {
  display: flex;
  gap: 10px;
  width: 500px;
}

.topbar input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.topbar button {
  padding: 10px 14px;
  border: none;
  background: #6b7280;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.layout {
  display: flex;
  height: calc(100vh - 60px);
}

.left {
  width: 360px;
  background: white;
  padding: 14px;
  border-right: 1px solid #ddd;
  overflow-y: auto;
}

.right {
  flex: 1;
  padding: 18px;
}

input, select {
  width: 100%;
  padding: 9px;
  margin: 6px 0 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.btn {
  width: 100%;
  padding: 10px;
  background: #6b7280;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.btn-group .btn {
  flex: 1;   /* instead of width: 100% */
}

.profile-card {
  display: none;
  background: white;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}

/* TOP */
.profile-top {
  display: flex;
  gap: 15px;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}

.profile-img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.action-buttons {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.action-buttons .btn {
  width: 90px;
  padding: 6px;
  font-size: 12px;
  border-radius: 6px;
}

.action-btn {
  background: #e5e7eb;
  color: #111827;
}

.action-btn:hover {
  background: #d1d5db;
}

.delete-btn:hover {
  background: #fecaca;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #f1f1f1;
}

.section {
  font-size: 10px;
  font-weight: normal;
  color: #6b7280;
  margin-top: 10px;
}
#results {
  max-width: 500px;
  margin: 8px auto;
}

.result {
  padding: 6px 8px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 1px solid #f1f1f1;
}

.result:hover {
  background: #f9fafb;
}
.result-id {
  color: #9ca3af;
  font-size: 12px;
}
.doc-row { font-size: 12px; }
.doc-text a { color: #2563eb; text-decoration: none; }

.btn-group {
  display: flex;
  gap: 10px;
}

.btn-group .btn {
  width: 100%;
}

/* ✅ SAVE BUTTON (GREEN) */
.save-btn {
  background: #16a34a; /* green */
}

.save-btn:hover {
  background: #15803d;
}

/* ⚪ CLEAR BUTTON (GRAY) */
.clear-btn {
  background: #9ca3af;
}

.clear-btn:hover {
  background: #6b7280;
}

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
  #birthdate::placeholder {
  color: #9ca3af; /* gray */
  opacity: 1;
}
/* Placeholder style */
select.placeholder {
  color: #737982;
}

/* Selected style */
select.filled {
  color: #000000;
}
  .doc-text a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="search-box">
    <input id="searchID" placeholder="Search Name or ID">
    <button onclick="searchData()">Search</button>
  </div>
  <button onclick="logout()" style="position:absolute; top:10px; right:10px;">Logout</button>
</div>
<div id="results"></div>

<div class="layout">

<div class="left">

  <div class="section">PERSONAL INFO</div>

  <input id="name" placeholder="Full Name">
  <input id="person_id" placeholder="ID">
  <input type="text" id="birthdate" placeholder="Birthdate">
  <input id="age" placeholder="Age">

  <select id="gender" class="placeholder">
  <option value="" disabled selected hidden>Gender</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>

  <input id="address" placeholder="Address">
  <input id="mobile" placeholder="Mobile">
  <input id="email" placeholder="Email">

  <div class="section">UPLOAD SELFIE IMAGE</div>
  <input type="file" id="photo" accept="image/*">

  <div class="section">BIRTH CERTIFICATE</div>
  <input type="file" id="birth_cert" accept=".pdf,image/*">

  <div class="section">SCHOOL RECORDS</div>
  <input type="file" id="school_record" accept=".pdf,image/*">

  <div class="section">BARANGAY CLEARANCE</div>
  <input type="file" id="brgy_clearance" accept=".pdf,image/*">

<div class="btn-group">
  <button class="btn save-btn" id="saveBtn" onclick="saveData()">Save Record</button>
  <button class="btn clear-btn" onclick="clearForm()">Clear Form</button>
</div>

</div> <!-- ✅ CLOSE LEFT PANEL HERE -->

<div class="right">

  <div class="profile-card" id="profile">

    <div class="profile-top">
      <img id="photoView" class="profile-img">

      <div class="action-buttons">
        <button class="btn action-btn" onclick="editRecord()">✏️ Edit</button>
        <button class="btn action-btn" onclick="updateRecord()">💾 Save</button>
        <button class="btn action-btn delete-btn" onclick="deleteRecord()">🗑️ Delete</button>
        <button class="btn action-btn" onclick="openTraining()">📚 Training</button>
</div>
      </div>

    <div class="row"><b>Name</b><span id="d_name"></span></div>
    <div class="row"><b>ID</b><span id="d_id"></span></div>
    <div class="row"><b>Birthdate</b><span id="d_birth"></span></div>
    <div class="row"><b>Age</b><span id="d_age"></span></div>
    <div class="row"><b>Gender</b><span id="d_gender"></span></div>
    <div class="row"><b>Address</b><span id="d_address"></span></div>
    <div class="row"><b>Mobile</b><span id="d_mobile"></span></div>
    <div class="row"><b>Email</b><span id="d_email"></span></div>

    <div class="section">Documents</div>

   <div class="row doc-row">
  <b>Birth Certificate</b>
  <span id="d_birth_cert" class="doc-text"></span>
</div>

<div class="row doc-row">
  <b>School Records</b>
  <span id="d_school" class="doc-text"></span>
</div>

<div class="row doc-row">
  <b>Barangay Clearance</b>
  <span id="d_brgy" class="doc-text"></span>
</div>

    <div class="section">QR CODE</div>
<img id="d_qr" style="width:120px; margin-top:10px;" />

  </div>

</div>

</div>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= DIVISION ================= */
let division = localStorage.getItem("division");

// CLEAN invalid values
if (division === "null" || division === "undefined" || !division) {
  division = null;
}

console.log("ACTIVE DIVISION:", division);

/* ================= AUTH ================= */
(async function () {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) window.location.href = "login.html";
})();

/* ================= STATE ================= */
let currentID = null;

/* ================= SEARCH ================= */
function searchData() {
  const q = searchID.value || "";

  let url = `${SUPABASE_URL}/rest/v1/ids?or=(name.ilike.*${q}*,person_id.ilike.*${q}*)`;

  if (division) {
    url = `${SUPABASE_URL}/rest/v1/ids?and=(division.eq.${division},or(name.ilike.*${q}*,person_id.ilike.*${q}*))`;
  }

  fetch(url, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  })
  .then(r => r.json())
  .then(data => {
    console.log("SEARCH RESULT:", data); // 🔥 DEBUG

    if (!data || !data.length) {
      alert("No record found");
      profile.style.display = "none";
      return;
    }

    results.style.display = "block";
    results.innerHTML = "";

    data.forEach(u => {
      const div = document.createElement("div");
      div.className = "result";

      div.innerHTML = `<b>${u.name}</b><div>${u.person_id}</div>`;

      div.onclick = () => loadByID(u.person_id);

      results.appendChild(div);
    });
  });
}

/* ================= LOAD ================= */
function loadByID(id) {

  let url = `${SUPABASE_URL}/rest/v1/ids?person_id=eq.${id}`;

  if (division) {
    url = `${SUPABASE_URL}/rest/v1/ids?and=(person_id.eq.${id},division.eq.${division})`;
  }

  fetch(url, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  })
  .then(r => r.json())
  .then(d => {
    console.log("LOAD RESULT:", d); // 🔥 DEBUG

    if (!d || !d.length) {
      alert("No record found in loadByID");
      return;
    }

    const u = d[0];
    currentID = u.person_id;

    profile.style.display = "block";

    d_name.innerText = u.name;
    d_id.innerText = u.person_id;
    d_birth.innerText = u.birthdate;
    d_age.innerText = u.age;
    d_gender.innerText = u.gender;
    d_address.innerText = u.address;
    d_mobile.innerText = u.mobile;
    d_email.innerText = u.email;

    d_qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${id}`;
  });
}

/* ================= BASIC SAVE (RESTORED) ================= */
async function saveData() {
  const id = person_id.value || "ID-" + Date.now();

  await fetch(`${SUPABASE_URL}/rest/v1/ids`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: name.value,
      person_id: id,
      birthdate: birthdate.value,
      age: age.value,
      gender: gender.value,
      address: address.value,
      mobile: mobile.value,
      email: email.value,
      division: division
    })
  });

  alert("Saved!");
  loadByID(id);
}

/* ================= DELETE ================= */
async function deleteRecord() {
  if (!confirm("Delete this record?")) return;

  await fetch(`${SUPABASE_URL}/rest/v1/ids?person_id=eq.${currentID}`, {
    method: "DELETE",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  });

  alert("Deleted!");
  profile.style.display = "none";
}

/* ================= LOGOUT ================= */
async function logout() {
  await supabase.auth.signOut();
  localStorage.clear();
  window.location.replace("login.html");
}
</script>
