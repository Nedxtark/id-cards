<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Uniform ID Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f3f4f6;
}

.topbar {
  padding: 12px;
  background: white;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
}

.layout {
  display: flex;
  height: 100vh;
}

.left {
  width: 350px;
  background: white;
  padding: 15px;
  border-right: 1px solid #ddd;
}

.right {
  flex: 1;
  padding: 20px;
}

input, select {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
}
button {
  padding: 8px 12px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div>Dashboard</div>
  <button onclick="logout()">Logout</button>
</div>

<div class="layout">

  <div class="left">
    <input id="name" placeholder="Name">
    <input id="person_id" placeholder="ID">
    <input id="birthdate" placeholder="Birthdate">
    <input id="age" placeholder="Age">

    <select id="gender">
      <option value="">Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <button onclick="saveData()">Save</button>
  </div>

  <div class="right">
    <h3>Profile View</h3>
    <div id="output"></div>
  </div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentID = null;

/* ================= AUTH PROTECTION ================= */
(async function () {
  const { data, error } = await supabase.auth.getSession();

  if (error || !data.session) {
    window.location.replace("login.html");
  }
})();

/* ================= SAVE DATA ================= */
async function saveData() {

  const id = document.getElementById("person_id").value;

  const { error } = await supabase
    .from("ids")
    .insert({
      name: document.getElementById("name").value,
      person_id: id,
      birthdate: document.getElementById("birthdate").value,
      age: document.getElementById("age").value,
      gender: document.getElementById("gender").value
    });

  if (error) {
    alert(error.message);
    return;
  }

  alert("Saved!");
  loadByID(id);
}

/* ================= LOAD DATA ================= */
async function loadByID(id) {

  const { data, error } = await supabase
    .from("ids")
    .select("*")
    .eq("person_id", id);

  if (error || !data.length) return;

  const u = data[0];
  currentID = u.person_id;

  document.getElementById("output").innerHTML = `
    <p><b>Name:</b> ${u.name}</p>
    <p><b>ID:</b> ${u.person_id}</p>
    <p><b>Gender:</b> ${u.gender}</p>
  `;
}

/* ================= LOGOUT ================= */
async function logout() {
  await supabase.auth.signOut();
  window.location.href = "login.html";
}
</script>

</body>
</html>
