<!DOCTYPE html>
<html>
<head>
<title>Uniform ID Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial;
  background: #f3f4f6;
}

.topbar {
  display: flex;
  justify-content: center;
  padding: 12px;
  background: #fff;
  border-bottom: 1px solid #ddd;
}

.search-box {
  display: flex;
  gap: 10px;
  width: 500px;
}

.topbar input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.topbar button {
  padding: 10px 14px;
  border: none;
  background: #6b7280;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.layout {
  display: flex;
  height: calc(100vh - 60px);
}

.left {
  width: 360px;
  background: white;
  padding: 14px;
  border-right: 1px solid #ddd;
  overflow-y: auto;
}

.right {
  flex: 1;
  padding: 18px;
}

input, select {
  width: 100%;
  padding: 9px;
  margin: 6px 0 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.btn {
  width: 100%;
  padding: 10px;
  background: #6b7280;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.btn-group .btn {
  flex: 1;   /* instead of width: 100% */
}

.profile-card {
  display: none;
  background: white;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}

/* TOP */
.profile-top {
  display: flex;
  gap: 15px;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}

.profile-img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.action-buttons {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.action-buttons .btn {
  width: 90px;
  padding: 6px;
  font-size: 12px;
  border-radius: 6px;
}

.action-btn {
  background: #e5e7eb;
  color: #111827;
}

.action-btn:hover {
  background: #d1d5db;
}

.delete-btn:hover {
  background: #fecaca;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #f1f1f1;
}

.section {
  font-size: 10px;
  font-weight: normal;
  color: #6b7280;
  margin-top: 10px;
}
#results {
  max-width: 500px;
  margin: 8px auto;
}

.result {
  padding: 6px 8px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 1px solid #f1f1f1;
}

.result:hover {
  background: #f9fafb;
}
.result-id {
  color: #9ca3af;
  font-size: 12px;
}
.doc-row { font-size: 12px; }
.doc-text a { color: #2563eb; text-decoration: none; }

.btn-group {
  display: flex;
  gap: 10px;
}

.btn-group .btn {
  width: 100%;
}

/* ✅ SAVE BUTTON (GREEN) */
.save-btn {
  background: #16a34a; /* green */
}

.save-btn:hover {
  background: #15803d;
}

/* ⚪ CLEAR BUTTON (GRAY) */
.clear-btn {
  background: #9ca3af;
}

.clear-btn:hover {
  background: #6b7280;
}

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
  #birthdate::placeholder {
  color: #9ca3af; /* gray */
  opacity: 1;
}
/* Placeholder style */
select.placeholder {
  color: #737982;
}

/* Selected style */
select.filled {
  color: #000000;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="search-box">
    <input id="searchID" placeholder="Search Name or ID">
    <button onclick="searchData()">Search</button>
  </div>
</div>
<div id="results"></div>

<div class="layout">

<div class="left">

  <div class="section">PERSONAL INFO</div>

  <input id="name" placeholder="Full Name">
  <input id="person_id" placeholder="ID">
  <input type="text" id="birthdate" placeholder="Birthdate">
  <input id="age" placeholder="Age">

  <select id="gender" class="placeholder">
  <option value="" disabled selected hidden>Gender</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>

  <input id="address" placeholder="Address">
  <input id="mobile" placeholder="Mobile">
  <input id="email" placeholder="Email">

  <div class="section">UPLOAD SELFIE IMAGE</div>
  <input type="file" id="photo" accept="image/*">

  <div class="section">BIRTH CERTIFICATE</div>
  <input type="file" id="birth_cert" accept=".pdf,image/*">

  <div class="section">SCHOOL RECORDS</div>
  <input type="file" id="school_record" accept=".pdf,image/*">

  <div class="section">BARANGAY CLEARANCE</div>
  <input type="file" id="brgy_clearance" accept=".pdf,image/*">

<div class="btn-group">
  <button class="btn save-btn" id="saveBtn" onclick="saveData()">Save Record</button>
  <button class="btn clear-btn" onclick="clearForm()">Clear Form</button>
</div>

</div> <!-- ✅ CLOSE LEFT PANEL HERE -->

<div class="right">

  <div class="profile-card" id="profile">

    <div class="profile-top">
      <img id="photoView" class="profile-img">

      <div class="action-buttons">
        <button class="btn action-btn" onclick="editRecord()">✏️ Edit</button>
        <button class="btn action-btn" onclick="updateRecord()">💾 Save</button>
        <button class="btn action-btn delete-btn" onclick="deleteRecord()">🗑️ Delete</button>
        <button class="btn action-btn" onclick="openTraining()">📚 Training</button>
</div>
      </div>

    <div class="row"><b>Name</b><span id="d_name"></span></div>
    <div class="row"><b>ID</b><span id="d_id"></span></div>
    <div class="row"><b>Birthdate</b><span id="d_birth"></span></div>
    <div class="row"><b>Age</b><span id="d_age"></span></div>
    <div class="row"><b>Gender</b><span id="d_gender"></span></div>
    <div class="row"><b>Address</b><span id="d_address"></span></div>
    <div class="row"><b>Mobile</b><span id="d_mobile"></span></div>
    <div class="row"><b>Email</b><span id="d_email"></span></div>

    <div class="section">Documents</div>

    <div class="row doc-row"><b>Birth Certificate</b><span id="d_birth_cert"></span></div>
    <div class="row doc-row"><b>School Records</b><span id="d_school"></span></div>
    <div class="row doc-row"><b>Barangay Clearance</b><span id="d_brgy"></span></div>

    <div class="section">QR CODE</div>
<img id="d_qr" style="width:120px; margin-top:10px;" />

  </div>

</div>

</div>

<script>

const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI";

let currentID = null;

function calculateAge(dateString) {
  const today = new Date();
  const birthDate = new Date(dateString);

  let age = today.getFullYear() - birthDate.getFullYear();
  const m = today.getMonth() - birthDate.getMonth();

  // Adjust if birthday hasn't happened yet this year
  if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
    age--;
  }

  return age;
}
function updateButtonState() {
  const btn = document.getElementById("saveBtn");
  const idField = document.getElementById("person_id");

  if (currentID) {
    btn.innerText = "Update Record";
    idField.disabled = true;
  } else {
    btn.innerText = "Save Record";
    idField.disabled = false;
  }
}
/* UPLOAD */
async function uploadFile(file, folder, name) {
  if (!file) return null;

  const ext = file.name.split('.').pop();
  const path = `${name}_${Date.now()}.${ext}`;

  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${folder}/${path}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "x-upsert": "true",
      "Content-Type": file.type   // ✅ IMPORTANT FIX
    },
    body: file
  });

  if (!res.ok) {
    const err = await res.text();
    console.error("UPLOAD ERROR:", err);
alert("UPLOAD ERROR: " + err);
throw new Error(err);
  }

  return path;
}

/* SAVE */
async function saveData() {
  try {

    // IF EDITING → UPDATE
    if (currentID) {
      await updateRecord();
      return;
    }

    let id = document.getElementById("person_id").value;

    // AUTO GENERATE ID
    if (!id) {
      id = "ID-" + Date.now();
      document.getElementById("person_id").value = id;
    }

    const photoFile = document.getElementById("photo").files[0];
    const birthFile = document.getElementById("birth_cert").files[0];
    const schoolFile = document.getElementById("school_record").files[0];
    const brgyFile = document.getElementById("brgy_clearance").files[0];


    // DEBUG
    console.log({ birthFile, schoolFile, brgyFile });

    // UPLOAD
    const photo = photoFile ? await uploadFile(photoFile, "photos", id+"_photo") : null;
const birth = birthFile ? await uploadFile(birthFile, "documents", id+"_birth") : null;
const school = schoolFile ? await uploadFile(schoolFile, "documents", id+"_school") : null;
const brgy = brgyFile ? await uploadFile(brgyFile, "documents", id+"_brgy") : null;
    console.log({ birth, school, brgy });

    // SAVE TO DB
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ids`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: document.getElementById("name").value,
  person_id: id,
  birthdate: document.getElementById("birthdate").value,
  age: document.getElementById("age").value,
  gender: document.getElementById("gender").value,
  address: document.getElementById("address").value,
  mobile: document.getElementById("mobile").value,
  email: document.getElementById("email").value,
  photo,
  birth_cert: birth,
  school_record: school,
  brgy_clearance: brgy
})
    });

    if (!res.ok) {
      const err = await res.text();
      console.error(err);
      alert("Error saving!");
      return;
    }

    alert("Saved!");

    // QR
    const qrData = `https://nedxtark.github.io/id-cards/view.html?id=${id}`;
    document.getElementById("d_qr").src =
      `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrData)}`;

    loadByID(id);

  } catch (err) {
    console.error(err);
    alert("Error occurred");
  }
}
function searchData() {
  const q = searchID.value;

  fetch(`${SUPABASE_URL}/rest/v1/ids?or=(name.ilike.*${q}*,person_id.ilike.*${q}*)&order=name.asc`, {
    headers: { 
      apikey: SUPABASE_KEY, 
      Authorization: "Bearer " + SUPABASE_KEY 
    }
  })
  .then(r => r.json())
  .then(data => {

    if (!data.length) {
  alert("No record");

  document.getElementById("profile").style.display = "none";
  currentID = null;
  updateButtonState();

  return;
}

    const container = document.getElementById("results");
    container.style.display = "block"; // ✅ SHOW RESULTS
    container.innerHTML = "";

    data.forEach(u => {
      const div = document.createElement("div");
      div.className = "result";

      div.innerHTML = `
        <div><b>${u.name}</b></div>
        <div class="result-id">${u.person_id}</div>
      `;

      div.onclick = () => {
        loadByID(u.person_id);
        container.style.display = "none";
      };

      container.appendChild(div);
    });

  });
}

function loadByID(id) {
  fetch(`${SUPABASE_URL}/rest/v1/ids?person_id=eq.${id}`, {
    headers: { 
      apikey: SUPABASE_KEY, 
      Authorization: "Bearer " + SUPABASE_KEY 
    }
  })
  .then(r => r.json())
  .then(d => {
    if (!d.length) return;

    const u = d[0];
    currentID = u.person_id;
    updateButtonState();

    profile.style.display = "block";

    d_name.innerText = u.name;
    d_id.innerText = u.person_id;
    d_birth.innerText = u.birthdate;
    d_age.innerText = u.age;
    d_gender.innerText = u.gender;
    d_address.innerText = u.address;
    d_mobile.innerText = u.mobile;
    d_email.innerText = u.email;

    // QR CODE GENERATION
const qrData = `https://nedxtark.github.io/id-cards/view.html?id=${u.person_id}`;
d_qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrData)}`;

    const link = f => f
       ? `<a href="${SUPABASE_URL}/storage/v1/object/public/documents/${f}?t=${Date.now()}" target="_blank">View</a>`
  : "No file";

    d_birth_cert.innerHTML = link(u.birth_cert);
    d_school.innerHTML = link(u.school_record);
    d_brgy.innerHTML = link(u.brgy_clearance);

    // STORE CURRENT FILE VALUES
d_birth_cert.dataset.file = u.birth_cert;
d_school.dataset.file = u.school_record;
d_brgy.dataset.file = u.brgy_clearance;

    photoView.src = u.photo
      ? `${SUPABASE_URL}/storage/v1/object/public/photos/${u.photo}`
      : "https://via.placeholder.com/120";
  });
}
/* EDIT */
function editRecord() {
  name.value = d_name.innerText;
  person_id.value = d_id.innerText;
  birthdate.value = d_birth.innerText;
  age.value = d_age.innerText;
  gender.value = d_gender.innerText;
  if (gender.value) {
  gender.classList.remove("placeholder");
  gender.classList.add("filled");
}
  address.value = d_address.innerText;
  mobile.value = d_mobile.innerText;
  email.value = d_email.innerText;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* UPDATE */
async function updateRecord() {

 const photoFile = document.getElementById("photo").files[0];
const birthFile = document.getElementById("birth_cert").files[0];
const schoolFile = document.getElementById("school_record").files[0];
const brgyFile = document.getElementById("brgy_clearance").files[0];

console.log({
  photoFile,
  birthFile,
  schoolFile,
  brgyFile
});
let photo = null, birth = null, school = null, brgy = null;

if (photoFile) {
  photo = await uploadFile(photoFile, "photos", currentID+"_photo");
}

if (birthFile) {
  birth = await uploadFile(birthFile, "documents", currentID+"_birth");
}

if (schoolFile) {
  school = await uploadFile(schoolFile, "documents", currentID+"_school");
}

if (brgyFile) {
  brgy = await uploadFile(brgyFile, "documents", currentID+"_brgy");
}
  const data = {
  name: document.getElementById("name").value,
  birthdate: birthdate.value,
  age: age.value,
  gender: gender.value,
  address: address.value,
  mobile: mobile.value,
  email: email.value
};

  if (photo) data.photo = photo;

 if (birth !== null) {
  data.birth_cert = birth;
} else if (d_birth_cert.dataset.file !== undefined) {
  data.birth_cert = d_birth_cert.dataset.file;
}

if (school !== null) {
  data.school_record = school;
} else if (d_school.dataset.file !== undefined) {
  data.school_record = d_school.dataset.file;
}

if (brgy !== null) {
  data.brgy_clearance = brgy;
} else if (d_brgy.dataset.file !== undefined) {
  data.brgy_clearance = d_brgy.dataset.file;
}
console.log("FINAL DATA:", data);

await fetch(`${SUPABASE_URL}/rest/v1/ids?person_id=eq.${currentID}`, {
  method: "PATCH",
  headers: {
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  },
  body: JSON.stringify(data)
});

  alert("Updated!");
loadByID(currentID);
}

/* DELETE */
async function deleteRecord() {
  if (!confirm("Delete this record?")) return;

  await fetch(`${SUPABASE_URL}/rest/v1/ids?person_id=eq.${currentID}`, {
    method: "DELETE",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  });

  alert("Deleted!");
  profile.style.display = "none";
}
function openTraining() {
  if (!currentID) {
    alert("Load a profile first");
    return;
  }

  window.open(`training.html?id=${currentID}`, "_blank");
}
document.addEventListener("DOMContentLoaded", function () {

  // SEARCH INPUT CLEAR
  document.getElementById("searchID").addEventListener("input", function () {
    const container = document.getElementById("results");

    if (this.value.trim() === "") {
      container.innerHTML = "";
      container.style.display = "none";
    }
  });

  // ✅ BIRTHDATE → AUTO AGE
  document.getElementById("birthdate").addEventListener("change", function () {
    const ageInput = document.getElementById("age");

    if (this.value) {
      ageInput.value = calculateAge(this.value);
    } else {
      ageInput.value = "";
    }
  });
  // ✅ GENDER COLOR CONTROL
  const genderSelect = document.getElementById("gender");
// Reset gender value
genderSelect.value = "";

// Reset style back to placeholder (gray)
genderSelect.classList.remove("filled");
genderSelect.classList.add("placeholder");
  genderSelect.addEventListener("change", function () {
    if (this.value !== "") {
      this.classList.remove("placeholder");
      this.classList.add("filled");
    }
  });

  // ENTER KEY SEARCH
  document.getElementById("searchID").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      searchData();
    }
  });
  const birthInput = document.getElementById("birthdate");

// Focus → show date picker
birthInput.addEventListener("focus", function () {
  this.type = "date";
});

// Blur → back to placeholder if empty
birthInput.addEventListener("blur", function () {
  if (!this.value) {
    this.type = "text";
  }
});

// Change → calculate age
birthInput.addEventListener("change", function () {
  const ageInput = document.getElementById("age");

  if (this.value) {
    ageInput.value = calculateAge(this.value);
  }
});

  // HIDE PROFILE ON LOAD
  document.getElementById("profile").style.display = "none";

});

function clearForm() {

  // Clear text fields
  document.getElementById("name").value = "";
  document.getElementById("person_id").value = "";
  document.getElementById("birthdate").value = "";
  document.getElementById("age").value = "";
 const genderSelect = document.getElementById("gender");
// ✅ RESET VALUE
genderSelect.value = "";

// ✅ RESET COLOR BACK TO PLACEHOLDER
genderSelect.classList.remove("filled");
genderSelect.classList.add("placeholder");
  document.getElementById("address").value = "";
  document.getElementById("mobile").value = "";
  document.getElementById("email").value = "";

  // Clear file inputs
  document.getElementById("photo").value = "";
  document.getElementById("birth_cert").value = "";
  document.getElementById("school_record").value = "";
  document.getElementById("brgy_clearance").value = "";

  // Reset state
  currentID = null;
  updateButtonState();

  // Hide profile display
  document.getElementById("profile").style.display = "none";

}

  

</script>

</body>
</html>
