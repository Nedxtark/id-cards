<!DOCTYPE html>
<html>
<head>
<title>Uniform ID Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial;
  background: #f3f4f6;
}

.topbar {
  display: flex;
  justify-content: center;
  padding: 12px;
  background: #fff;
  border-bottom: 1px solid #ddd;
}

.search-box {
  display: flex;
  gap: 10px;
  width: 500px;
}

.topbar input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.topbar button {
  padding: 10px 14px;
  border: none;
  background: #6b7280;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.layout {
  display: flex;
  height: calc(100vh - 60px);
}

.left {
  width: 360px;
  background: white;
  padding: 14px;
  border-right: 1px solid #ddd;
  overflow-y: auto;
}

.right {
  flex: 1;
  padding: 18px;
}

input, select {
  width: 100%;
  padding: 9px;
  margin: 6px 0 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.btn {
  width: 100%;
  padding: 10px;
  background: #6b7280;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.btn-group .btn {
  flex: 1;   /* instead of width: 100% */
}

.profile-card {
  display: none;
  background: white;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}

/* TOP */
.profile-top {
  display: flex;
  gap: 15px;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}

.profile-img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.action-buttons {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.action-buttons .btn {
  width: 90px;
  padding: 6px;
  font-size: 12px;
  border-radius: 6px;
}

.action-btn {
  background: #e5e7eb;
  color: #111827;
}

.action-btn:hover {
  background: #d1d5db;
}

.delete-btn:hover {
  background: #fecaca;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #f1f1f1;
}

.section {
  font-size: 10px;
  font-weight: normal;
  color: #6b7280;
  margin-top: 10px;
}
  .search-wrapper {
  position: relative;
  width: 500px;
}

#results {
  position: absolute;
  top: 42px;
  left: 0;
  width: 83%;
  background: white;
  border: 1px solid #ddd;
  border-top: none;
  max-height: 250px;
  overflow-y: auto;
  z-index: 9999;
}
.result {
  padding: 6px 8px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 1px solid #f1f1f1;
}

.result:hover {
  background: #f9fafb;
}
.result-id {
  color: #9ca3af;
  font-size: 12px;
}
  .result-item {
  padding: 10px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
  background: white;
}

.result-item:hover,
.result-item.active {
  background: #e5e7eb;
}

.result-sub {
  font-size: 12px;
  color: #6b7280;
}
.doc-row { font-size: 12px; }
.doc-text a { color: #2563eb; text-decoration: none; }

.btn-group {
  display: flex;
  gap: 10px;
}

.btn-group .btn {
  width: 100%;
}

/* ✅ SAVE BUTTON (GREEN) */
.save-btn {
  background: #16a34a; /* green */
}

.save-btn:hover {
  background: #15803d;
}

/* ⚪ CLEAR BUTTON (GRAY) */
.clear-btn {
  background: #9ca3af;
}

.clear-btn:hover {
  background: #6b7280;
}

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
  #birthdate::placeholder {
  color: #9ca3af; /* gray */
  opacity: 1;
}
/* Placeholder style */
select.placeholder {
  color: #737982;
}

/* Selected style */
select.filled {
  color: #000000;
}
  .doc-text a:hover {
  text-decoration: underline;
}
  .result-item {
  padding: 10px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
  background: white;
}

.result-item:hover {
  background: #f3f4f6;
}

.result-sub {
  font-size: 12px;
  color: #6b7280;

}
  .search-box-wrapper {
  position: relative;
  width: 500px;
}
</style>
</head>

<body>
<div class="topbar">
  <div class="search-wrapper">
    <div class="search-box">
      <input id="searchID" placeholder="Search Name or ID">
      <button onclick="searchData()">Search</button>
    </div>

    <div id="results"></div>
  </div>

  <button onclick="logout()" style="position:absolute; top:10px; right:10px;">
    Logout
  </button>
</div>

<div class="layout">

<div class="left">

  <div class="section">PERSONAL INFO</div>

  <input id="name" placeholder="Full Name">
  <input id="person_id" placeholder="ID">
   <input type="date" id="birthdate">
  <input id="age" placeholder="Age" readonly>

  <select id="gender" class="placeholder">
  <option value="" disabled selected hidden>Gender</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>

  <input id="address" placeholder="Address">
  <input id="mobile" placeholder="Mobile">
  <input id="email" placeholder="Email">

  <div class="section">UPLOAD SELFIE IMAGE</div>
  <input type="file" id="photo" accept="image/*">

  <div class="section">BIRTH CERTIFICATE</div>
  <input type="file" id="birth_cert" accept=".pdf,image/*">

  <div class="section">SCHOOL RECORDS</div>
  <input type="file" id="school_record" accept=".pdf,image/*">

  <div class="section">BARANGAY CLEARANCE</div>
  <input type="file" id="brgy_clearance" accept=".pdf,image/*">

<div class="btn-group">
  <button class="btn save-btn" id="saveBtn" onclick="saveData()">Save Record</button>
  <button class="btn clear-btn" onclick="clearForm()">Clear Form</button>
</div>

</div> <!-- ✅ CLOSE LEFT PANEL HERE -->

<div class="right">

  <div class="profile-card" id="profile">

    <div class="profile-top">
      <img id="photoView" class="profile-img">

      <div class="action-buttons">
        <button class="btn action-btn" onclick="editRecord()">✏️ Edit</button>
        <button class="btn action-btn" onclick="updateRecord()">💾 Save</button>
        <button class="btn action-btn delete-btn" onclick="deleteRecord()">🗑️ Delete</button>
        <button class="btn action-btn" onclick="openTraining()">📚 Training</button>
</div>
      </div>

    <div class="row"><b>Name</b><span id="d_name"></span></div>
    <div class="row"><b>ID</b><span id="d_id"></span></div>
    <div class="row"><b>Birthdate</b><span id="d_birth"></span></div>
    <div class="row"><b>Age</b><span id="d_age"></span></div>
    <div class="row"><b>Gender</b><span id="d_gender"></span></div>
    <div class="row"><b>Address</b><span id="d_address"></span></div>
    <div class="row"><b>Mobile</b><span id="d_mobile"></span></div>
    <div class="row"><b>Email</b><span id="d_email"></span></div>

    <div class="section">Documents</div>

   <div class="row doc-row">
  <b>Birth Certificate</b>
  <span id="d_birth_cert" class="doc-text"></span>
</div>

<div class="row doc-row">
  <b>School Records</b>
  <span id="d_school" class="doc-text"></span>
</div>

<div class="row doc-row">
  <b>Barangay Clearance</b>
  <span id="d_brgy" class="doc-text"></span>
</div>

    <div class="section">QR CODE</div>
<img id="d_qr" style="width:120px; margin-top:10px;" />

  </div>

</div>

</div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script> 
const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI";

// ✅ CLIENT
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ✅ DIVISION
let division = localStorage.getItem("division");

if (division === "null" || division === "undefined" || !division) {
  division = "trucking";
}

// ✅ TABLE SWITCH
let TABLE = "ids_trucking";

if (division === "training") {
  TABLE = "ids_training";
}

console.log("USING TABLE:", TABLE);

// ✅ ELEMENTS
const results = document.getElementById("results");
const profile = document.getElementById("profile");

let currentID = null;

// ✅ AUTH
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) window.location.href = "login.html";
})();

// ✅ SEARCH
function searchData() {
  const q = document.getElementById("searchID").value || "";

 let url = `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&or=(name.ilike.*${q}*,person_id.ilike.*${q}*)`;

  fetch(url, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  })
  .then(r => r.json())
  .then(data => {
    results.innerHTML = "";

    if (!data.length) {
      alert("No results");
      return;
    }

    data.forEach(u => {
      const div = document.createElement("div");
div.className = "result-item";
div.innerHTML = `
  <div><b>${u.name}</b></div>
  <div class="result-sub">${u.person_id}</div>
`;

div.onclick = (e) => {
  e.stopPropagation();
  loadByID(u.person_id);
  results.innerHTML = "";
};

results.appendChild(div);
    });
  });
}

// ✅ LOAD
function loadByID(id) {
  let url = `${SUPABASE_URL}/rest/v1/${TABLE}?person_id=eq.${id}`;

  fetch(url, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  })
  .then(r => r.json())
  .then(d => {
    if (!d.length) {
      alert("No record found");
      return;
    }

    const u = d[0];
    currentID = u.person_id;
    profile.style.display = "block";
    function fileLink(path) {
  if (!path) return "—";

  const url = `${SUPABASE_URL}/storage/v1/object/public/documents/${path}`;
  return `<a href="${url}" target="_blank">View</a>`;
}
   const photoUrl = u.photo
  ? `${SUPABASE_URL}/storage/v1/object/public/photos/${u.photo}`
  : "https://via.placeholder.com/120";

  document.getElementById("photoView").src = photoUrl;
    
    const repo = "https://nedxtark.github.io/view.html?id";
    const qrLink = `${window.location.origin}/id-cards/view.html?id=${encodeURIComponent(u.person_id)}&division=${division}`;

document.getElementById("d_qr").src =
  `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrLink)}`;
    document.getElementById("d_name").innerText = u.name;
    document.getElementById("d_id").innerText = u.person_id;
    document.getElementById("d_age").innerText = u.age;
    document.getElementById("d_birth").innerText = u.birthdate;
    document.getElementById("d_gender").innerText = u.gender;
    document.getElementById("d_address").innerText = u.address;
    document.getElementById("d_mobile").innerText = u.mobile;
    document.getElementById("d_email").innerText = u.email;
    document.getElementById("d_birth_cert").innerHTML = fileLink(u.birth_cert);
  document.getElementById("d_school").innerHTML = fileLink(u.school_record);
  document.getElementById("d_brgy").innerHTML = fileLink(u.brgy_clearance);

  });
}
async function uploadFile(file, folder) {
  if (!file) return null;

  const fileName = Date.now() + "_" + file.name;

  const { data, error } = await supabaseClient.storage
    .from("documents")
    .upload(`${folder}/${fileName}`, file);

  if (error) {
    console.error(error);
    alert("Upload failed");
    return null;
  }

  return `${folder}/${fileName}`; // save path in DB
}

// ✅ SAVE (FULL FIELDS)
async function saveData() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  const userEmail = session?.user?.email || "";
  console.log("SESSION:", session);
console.log("USER EMAIL:", userEmail);

  const id = document.getElementById("person_id").value || "ID-" + Date.now();

  // ✅ GET FILES
  const birthFile = document.getElementById("birth_cert").files[0];
  const photoFile = document.getElementById("photo").files[0];
  const schoolFile = document.getElementById("school_record").files[0];
  const brgyFile = document.getElementById("brgy_clearance").files[0];

  // ✅ UPLOAD PHOTO
  let photoPath = null;

  if (photoFile) {

    const fileName = Date.now() + "_" + photoFile.name;

    const { error } = await supabaseClient.storage
      .from("photos")
      .upload(fileName, photoFile);

    if (error) {
      console.error(error);

      alert(
        "PHOTO UPLOAD FAILED\n\n" +
        error.message
      );

      return;
    }

    photoPath = fileName;

    console.log("PHOTO SAVED:", photoPath);
  }

  // ✅ UPLOAD DOCUMENTS
  const birthPath = await uploadFile(birthFile, "birth");
  const schoolPath = await uploadFile(schoolFile, "school");
  const brgyPath = await uploadFile(brgyFile, "brgy");

  // ✅ PAYLOAD
  const payload = {

    name: document.getElementById("name").value,

    person_id: id,

    created_by: userEmail, // ✅ Logged-in user

    photo: photoPath,

    birthdate: document.getElementById("birthdate").value,

    age: document.getElementById("age").value,

    gender: document.getElementById("gender").value,

    address: document.getElementById("address").value,

    mobile: document.getElementById("mobile").value,

    email: document.getElementById("email").value,

    birth_cert: birthPath,
    school_record: schoolPath,
    brgy_clearance: brgyPath

  };

  // ✅ SAVE TO DATABASE
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      Prefer: "return=representation"
    },
    body: JSON.stringify(payload)
  });

  const text = await res.text();

  console.log("PAYLOAD:", payload);
  console.log("STATUS:", res.status);
  console.log("DB RESPONSE:", text);

  if (!res.ok) {
    alert("Save failed:\n" + text);
    return;
  }

  alert("Saved successfully!");
}
async function updateRecord() {
  if (!currentID) {
    alert("No record selected");
    return;
  }

  // ✅ BASE DATA
  let payload = {
    name: document.getElementById("name").value,
    birthdate: document.getElementById("birthdate").value,
    age: document.getElementById("age").value,
    gender: document.getElementById("gender").value,
    address: document.getElementById("address").value,
    mobile: document.getElementById("mobile").value,
    email: document.getElementById("email").value
  };

  // ✅ PHOTO UPLOAD
  const photoFile = document.getElementById("photo").files[0];

  if (photoFile) {
    const fileName = Date.now() + "_" + photoFile.name;

    const { error } = await supabaseClient.storage
      .from("photos")
      .upload(fileName, photoFile);

    if (error) {
      console.error(error);
      alert("Photo upload failed:\n" + error.message);
      return;
    }

    payload.photo = fileName;
  }

  // ✅ DOCUMENT FILES
  const birthFile = document.getElementById("birth_cert").files[0];
  const schoolFile = document.getElementById("school_record").files[0];
  const brgyFile = document.getElementById("brgy_clearance").files[0];

  if (birthFile) {
    payload.birth_cert = await uploadFile(birthFile, "birth");
  }

  if (schoolFile) {
    payload.school_record = await uploadFile(schoolFile, "school");
  }

  if (brgyFile) {
    payload.brgy_clearance = await uploadFile(brgyFile, "brgy");
  }

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/${TABLE}?person_id=eq.${currentID}`,
    {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    }
  );

  if (!res.ok) {
    const text = await res.text();
    alert("Update failed: " + text);
    return;
  }

  alert("Updated successfully!");
  loadByID(currentID);
}
  function editRecord() {
  if (!currentID) return;

  document.getElementById("name").value = document.getElementById("d_name").innerText;
  document.getElementById("person_id").value = currentID;
  document.getElementById("birthdate").value = document.getElementById("d_birth").innerText;
  document.getElementById("age").value = document.getElementById("d_age").innerText;
  document.getElementById("gender").value = document.getElementById("d_gender").innerText;
  document.getElementById("address").value = document.getElementById("d_address").innerText;
  document.getElementById("mobile").value = document.getElementById("d_mobile").innerText;
  document.getElementById("email").value = document.getElementById("d_email").innerText;
}
// ✅ DELETE (FIXED)
async function deleteRecord() {

  if (!currentID) {
    alert("No record selected");
    return;
  }

  if (!confirm(`Delete record ${currentID}?`)) {
    return;
  }

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/${TABLE}?person_id=eq.${encodeURIComponent(currentID)}`,
    {
      method: "DELETE",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        Prefer: "return=representation"
      }
    }
  );

  if (!res.ok) {
    const text = await res.text();
    console.error(text);
    alert("Delete failed:\n" + text);
    return;
  }

  const deleted = await res.json();

  if (!deleted.length) {
    alert("No record was deleted.");
    return;
  }

  alert("Record deleted successfully.");

  profile.style.display = "none";
  currentID = null;
  document.getElementById("results").innerHTML = "";
}

// ✅ LOGOUT
window.logout = async function () {
  await supabaseClient.auth.signOut();
  localStorage.clear();
  window.location.href = "login.html";
};
  function openTraining() {
  if (!currentID) {
    alert("Select a person first");
    return;
  }

  window.open(`training.html?id=${currentID}`, "_blank");
}

// ✅ CLEAR
function clearForm() {
  // ✅ clear all form inputs
  document.querySelectorAll(".left input").forEach(i => i.value = "");
  document.querySelectorAll(".left select").forEach(s => s.selectedIndex = 0);

  // ✅ clear file inputs
  document.getElementById("photo").value = "";
  document.getElementById("birth_cert").value = "";
  document.getElementById("school_record").value = "";
  document.getElementById("brgy_clearance").value = "";

  // ✅ clear profile display (RIGHT SIDE)
  document.getElementById("profile").style.display = "none";

  // ✅ reset current ID
  currentID = null;

  // ✅ clear search results dropdown
  document.getElementById("results").innerHTML = "";

  // ✅ optional: clear search input
  document.getElementById("searchID").value = "";
}
document.getElementById("birthdate").addEventListener("input", function () {

  const birth = new Date(this.value);

  if (isNaN(birth)) {
    document.getElementById("age").value = "";
    return;
  }

  const today = new Date();

  let age = today.getFullYear() - birth.getFullYear();

  const m = today.getMonth() - birth.getMonth();

  if (
    m < 0 ||
    (m === 0 && today.getDate() < birth.getDate())
  ) {
    age--;
  }

  document.getElementById("age").value = age;
});
  // if click is outside search area → hide dropdown
  document.addEventListener("click", function (e) {
  const searchWrapper = document.querySelector(".search-wrapper");

  if (searchWrapper && !searchWrapper.contains(e.target)) {
    document.getElementById("results").innerHTML = "";
  }
});
</script>
