<script>
let currentID = null;

/* ================== UTIL ================== */
function calculateAge(dateString) {
  const today = new Date();
  const birthDate = new Date(dateString);

  let age = today.getFullYear() - birthDate.getFullYear();
  const m = today.getMonth() - birthDate.getMonth();

  if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
    age--;
  }

  return age;
}

function updateButtonState() {
  const btn = document.getElementById("saveBtn");
  const idField = document.getElementById("person_id");

  if (currentID) {
    btn.innerText = "Update Record";
    idField.disabled = true;
  } else {
    btn.innerText = "Save Record";
    idField.disabled = false;
  }
}

/* ================== UPLOAD ================== */
async function uploadFile(file, folder, name) {
  if (!file) return null;

  const ext = file.name.split('.').pop();
  const path = `${name}_${Date.now()}.${ext}`;

  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${folder}/${path}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "x-upsert": "true",
      "Content-Type": file.type
    },
    body: file
  });

  if (!res.ok) {
    const err = await res.text();
    alert("UPLOAD ERROR: " + err);
    throw new Error(err);
  }

  return path;
}

/* ================== SAVE ================== */
async function saveData() {

  if (currentID) {
    await updateRecord();
    return;
  }

  let id = document.getElementById("person_id").value;

  if (!id) {
    id = "ID-" + Date.now();
    document.getElementById("person_id").value = id;
  }

  const photoFile = photo.files[0];
  const birthFile = birth_cert.files[0];
  const schoolFile = school_record.files[0];
  const brgyFile = brgy_clearance.files[0];

  const photo = photoFile ? await uploadFile(photoFile, "photos", id+"_photo") : null;
  const birth = birthFile ? await uploadFile(birthFile, "documents", id+"_birth") : null;
  const school = schoolFile ? await uploadFile(schoolFile, "documents", id+"_school") : null;
  const brgy = brgyFile ? await uploadFile(brgyFile, "documents", id+"_brgy") : null;

  const res = await fetch(`${SUPABASE_URL}/rest/v1/ids`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: name.value,
      person_id: id,
      birthdate: birthdate.value,
      age: age.value,
      gender: gender.value,
      address: address.value,
      mobile: mobile.value,
      email: email.value,
      photo,
      birth_cert: birth,
      school_record: school,
      brgy_clearance: brgy
    })
  });

  if (!res.ok) {
    alert("Error saving");
    return;
  }

  alert("Saved!");
  loadByID(id);
}

/* ================== SEARCH ================== */
function searchData() {
  const q = searchID.value;

  fetch(`${SUPABASE_URL}/rest/v1/ids?or=(name.ilike.*${q}*,person_id.ilike.*${q}*)&order=name.asc`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  })
  .then(r => r.json())
  .then(data => {

    if (!data.length) {
      alert("No record");
      profile.style.display = "none";
      currentID = null;
      updateButtonState();
      return;
    }

    const container = results;
    container.style.display = "block";
    container.innerHTML = "";

    data.forEach(u => {
      const div = document.createElement("div");
      div.className = "result";

      div.innerHTML = `
        <div><b>${u.name}</b></div>
        <div class="result-id">${u.person_id}</div>
      `;

      div.onclick = () => {
        loadByID(u.person_id);
        container.style.display = "none";
      };

      container.appendChild(div);
    });

  });
}

/* ================== LOAD ================== */
function loadByID(id) {
  fetch(`${SUPABASE_URL}/rest/v1/ids?person_id=eq.${id}`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  })
  .then(r => r.json())
  .then(d => {

    if (!d.length) return;

    const u = d[0];
    currentID = u.person_id;
    updateButtonState();

    profile.style.display = "block";

    d_name.innerText = u.name;
    d_id.innerText = u.person_id;
    d_birth.innerText = u.birthdate;
    d_age.innerText = u.age;
    d_gender.innerText = u.gender;
    d_address.innerText = u.address;
    d_mobile.innerText = u.mobile;
    d_email.innerText = u.email;

    const link = (f) => f
      ? `<a href="${SUPABASE_URL}/storage/v1/object/public/documents/${f}" target="_blank">View</a>`
      : "No file";

    d_birth_cert.innerHTML = link(u.birth_cert);
    d_school.innerHTML = link(u.school_record);
    d_brgy.innerHTML = link(u.brgy_clearance);

    photoView.src = u.photo
      ? `${SUPABASE_URL}/storage/v1/object/public/photos/${u.photo}`
      : "https://via.placeholder.com/120";
  });
}

/* ================== UPDATE ================== */
async function updateRecord() {
  await fetch(`${SUPABASE_URL}/rest/v1/ids?person_id=eq.${currentID}`, {
    method: "PATCH",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: name.value,
      birthdate: birthdate.value,
      age: age.value,
      gender: gender.value,
      address: address.value,
      mobile: mobile.value,
      email: email.value
    })
  });

  alert("Updated!");
  loadByID(currentID);
}

/* ================== DELETE ================== */
async function deleteRecord() {
  if (!confirm("Delete this record?")) return;

  await fetch(`${SUPABASE_URL}/rest/v1/ids?person_id=eq.${currentID}`, {
    method: "DELETE",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  });

  alert("Deleted!");
  profile.style.display = "none";
}

/* ================== LOGOUT ================== */
async function logout() {
  await supabase.auth.signOut();
  window.location.href = "login.html";
}
</script>
