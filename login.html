<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Login</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .card {
    background: #ffffff;
    padding: 30px;
    width: 320px;
    border-radius: 12px;
    position: relative;
    z-index: 1;
  }

  .logo {
    text-align: center;
    margin-bottom: 20px;
  }

  .logo img {
    width: 180px;
    height: auto;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input {
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
  }

  input:focus {
    border-color: #9ca3af;
  }

  button {
    margin: 15px auto 0; /* center button */
    display: block;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #6b7280;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background: #4b5563;
  }
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <img src="wtfs.png" alt="WTFS Logo">
  </div>

  <div class="input-group">
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
  </div>

  <button onclick="login()">Login</button>

</div>

<script>
  const USERNAME = "admin";
  const PASSWORD = "Wtfs8706";

  function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (!user || !pass) {
      alert("Please enter username and password");
      return;
    }

    if (user === USERNAME && pass === PASSWORD) {
      localStorage.setItem("session", btoa("office_logged_in"));
      window.location.href = "form.html";
    } else {
      alert("Invalid login");
    }
  }

  // ENTER key triggers login (fixed)
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      login();
    }
  });
</script>

</body>
</html>
