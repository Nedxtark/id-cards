<!DOCTYPE html>
<html>
<head>
  <title>Office Login</title>
</head>
<body style="font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f3f4f6;">

<div style="background:white; padding:20px; border-radius:10px; width:320px;">
  <h3>Office Access</h3>

  <input id="username" placeholder="Username" style="width:100%; padding:10px; margin:5px 0;">
  <input id="password" type="password" placeholder="Password" style="width:100%; padding:10px; margin:5px 0;">

  <button onclick="login()" style="width:100%; padding:10px; background:#16a34a; color:white;">Login</button>
</div>

<script>
const USERNAME = "admin";
const PASSWORD = "Wtfs8706";

function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (user === USERNAME && pass === PASSWORD) {
    localStorage.setItem("loggedIn", "true");
    window.location.href = "form.html";
  } else {
    alert("Invalid login");
  }
}

// Press ENTER to login
document.addEventListener("keydown", function(e) {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
