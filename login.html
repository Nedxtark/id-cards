<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Login</title>

<style>
 body::before {
  content: "";
  position: fixed;
  top: 50%;
  left: 50%;
  width: 400px; /* adjust size */
  height: 400px;
  background: url('wtfs.png') no-repeat center;
  background-size: contain;
  opacity: 0.08; /* 👈 adjust transparency here */
  transform: translate(-50%, -50%);
  z-index: 0;
}
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

.card {
  background: #ffffff;
  padding: 30px;
  width: 320px;
  border-radius: 12px;
  position: relative;
  z-index: 1;
}

  .title {
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-align: center;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input {
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
  }

  input:focus {
    border-color: #9ca3af;
  }

  button {
    margin-top: 15px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #6b7280;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background: #4b5563;
  }
</style>
</head>

<body>

<div class="card">
  <div class="title">Woo Trucking and Forlift Services</div>

  <div class="input-group">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
  </div>

  <button onclick="login()">Login</button>
</div>

<script>
  const USERNAME = "admin";
  const PASSWORD = "Wtfs8706";

  function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (!user || !pass) {
      alert("Please enter username and password");
      return;
    }

    if (user === USERNAME && pass === PASSWORD) {
      localStorage.setItem("session", btoa("office_logged_in"));
      window.location.href = "form.html";
    } else {
      alert("Invalid login");
    }
  }

  // ENTER → go directly to form.html
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      window.location.href = "form.html";
    }
  });
</script>

</body>
</html>
