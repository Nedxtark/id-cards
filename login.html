<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Login</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: #ffffff;
  padding: 30px;
  width: 320px;
  border-radius: 12px;
}

.logo {
  text-align: center;
  margin-bottom: 20px;
}

.logo img {
  width: 180px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #6b7280;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #4b5563;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <img src="wtfs.png" alt="Logo">
  </div>

  <input id="username" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

</div>

<!-- ✅ SUPABASE -->
<script>
const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// redirect if already logged in
supabase.auth.getSession().then(({ data }) => {
  if (data.session) {
    window.location.href = "form.html";
  }
});

// GLOBAL login function (IMPORTANT)
window.login = async function () {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  window.location.href = "form.html";
};
</script>

</body>
</html>
