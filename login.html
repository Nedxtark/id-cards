<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Login</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .card {
    background: #ffffff;
    padding: 30px;
    width: 320px;
    border-radius: 12px;
  }

  .logo {
    text-align: center;
    margin-bottom: 20px;
  }

  .logo img {
    width: 180px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input {
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
  }

  input:focus {
    border-color: #9ca3af;
    outline: none;
  }

  button {
    margin-top: 15px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #6b7280;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #4b5563;
  }
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <img src="wtfs.png" alt="WTFS Logo">
  </div>

  <div class="input-group">
    <input id="username" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
  </div>

  <button onclick="login()">Login</button>

</div>

<!-- ✅ SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://euocewpmtmevbxoskmlr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1b2Nld3BtdG1ldmJ4b3NrbWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjA0NzgsImV4cCI6MjA4OTk5NjQ3OH0.mu3_IGvFc5YO_2f5YKdrRaHnI0fzlpJ88zsBO5tsEbI"; // 🔥 PUT YOUR REAL KEY HERE

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔒 AUTO REDIRECT IF ALREADY LOGGED IN
(async function () {
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    window.location.replace("form.html");
  }
})();

// ✅ LOGIN FUNCTION
async function login() {
  const email = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Enter email & password");
    return;
  }

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  // ✅ SUCCESS
  window.location.href = "form.html";
}

// ✅ ENTER KEY SUPPORT
document.addEventListener("keydown", function(e) {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
